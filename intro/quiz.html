<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <script src="jquery-4.0.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .box {
            border: 1px solid black;
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <h1 class="text-center mt-4 mb-4">
        JQuery DOM Main
    </h1>
    <div class="box1">
        <div class="box">
            <h6>Paragraph1</h6>
            <h6>Paragraph2</h6>
        </div>
        <p>This is Paragraph4</p>
    </div>
        
    <button id="btnappend" class="btn btn-primary">Append</button>
    <button id="btnprepend" class="btn btn-danger">Prepend</button>
    <button id="btnbefore" class="btn btn-success">before</button>
    <button id="btnafter" class="btn btn-dark" style="color: aliceblue;">after</button>
    <button id="btnremove" class="btn btn-warning">Remove</button>
    <button id="btnreplace" class="btn btn-info">Replace</button>
    <button id="btnreplaceall" class="btn btn-secondary">ReplaceAll</button>
    <button id="btnwrap" class="btn btn-primary">Wrap</button>

</body>
</html>
<script>
    $(document).ready(function () {
        $("#btnappend").click(function () {
            $(".box ").append("<p id='added-paragraph' style='color: red;'>This is the added paragraph</p>");
        });
        $("#btnprepend").click(function () {
            $(".box").prepend("<p id='added-paragraph' style='color: red;'>This is the added paragraph</p>");
        });
        $("#btnbefore").click(function () {
            $(".box").before("<p id='added-paragraph' style='color: red;'>This is the added paragraph</p>");
        });
        $("#btnafter").click(function () {
            $(".box").after("<p id='added-paragraph' style='color: red;'>This is the added paragraph</p>");
        });
        $("#btnremove").click(function () {
            $(".box1 p").remove();
        });
        $("#btnreplace").click(function () {
            $(".box ").replaceWith("<p style='color: red;'>Replaced</p>");
        });
        $("#btnreplaceall").click(function () {
            $("p").replaceAll("<h1 style='color: red;'>Replaced All</h1>");
        });
        $("#btnwrap").click(function () {
            $("p").wrap("<div style='background-color: yellow;'></div>");
        });
    });

</script>
