<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Information</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="jquery-4.0.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body class="bg-body-tertiary">

  <main class="container py-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
          <h1 class="h3 fw-bold mb-0">Students Information</h1>
          <div>
            <button id="btnAdd" class="btn btn-dark"><i class="bi bi-plus-lg me-1"></i>Add New</button>
            <button id="btnEdit" class="btn btn-success"><i class="bi bi-pencil me-1"></i>Edit</button>
            <button id="btnRemove" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Remove</button>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle text-center mb-0">
            <thead class="table-dark">
              <tr>
                <th style="width:50px"><input type="checkbox" id="checkAll" class="form-check-input"></th>
                <th>ID</th>
                <th>Full Name</th>
                <th>Sex</th>
                <th>Phone Number</th>
                <th>DOB</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody id="studentTable">
              <tr>
                <td><input type="checkbox" class="form-check-input row-check"></td>
                <td>1</td><td>Noy Bunthoeun</td><td>F</td><td>090 541 548</td><td>01-Jan-2000</td><td>test@gmail.com</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  </main>

  <div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-dark text-white">
          <h5 class="modal-title" id="modalTitle">Add New</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <form id="studentForm" class="needs-validation" novalidate>
          <div class="modal-body">
            <div id="formError" class="alert alert-danger d-none" role="alert"></div>
            <div class="row g-3">
              <div class="col-md-6">
                <label for="id" class="form-label fw-semibold">ID</label>
                <input type="text" class="form-control bg-body-secondary" id="id" readonly tabindex="-1">
                <div class="form-text">Generated automatically.</div>
              </div>
              <div class="col-md-6">
                <label for="name" class="form-label fw-semibold">Full Name <span style=color:red>*</span></label>
                <input type="text" class="form-control" id="name" required placeholder="N/A">
                <small id="nameError" class="text-danger"></small>
                <div class="invalid-feedback">Enter the full name.</div>
              </div>
              <div class="col-md-6">
                <label for="sex" class="form-label fw-semibold">Sex <span style=color:red>*</span></label>
                <select class="form-select" id="sex" >
                
                  <option value="M">Male</option>
                  <option value="F">Female</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="dob" class="form-label fw-semibold" >Date of Birth <span style=color:red>*</span></label>
                <input type="date" class="form-control" id="dob" id="dob" required placeholder="N/A">
                <small id="dobError" class="text-danger"></small>
                <div class="invalid-feedback">Choose a date of birth.</div>
              </div>
              <div class="col-md-6">
                <label for="phone" class="form-label fw-semibold">Phone Number <span style=color:red>*</span></label>
                <input type="text" class="form-control" id="phone" required placeholder="N/A">
                <div class="invalid-feedback">Enter a phone number.</div>
                <small id="phoneError" class="text-danger"></small>
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label fw-semibold">Email <span style=color:red>*</span></label>
                <input type="email" class="form-control" id="email" required placeholder="N/A">
                <small id="emailError" class="text-danger"></small>
                <div class="invalid-feedback">Enter a valid email address.</div>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button type="submit" class="btn btn-success" id="saveBtn"><i class="bi bi-check-lg me-1"></i>Create</button>
            <button type="button" class="btn btn-danger" data-bs-dismiss="modal"><i class="bi bi-x-lg me-1"></i>Close</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Alert modal -->
  <div class="modal fade" id="alertModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body text-center p-4">
          <p class="mb-3" id="alertText"></p>
          <button type="button" class="btn btn-dark btn-sm" data-bs-dismiss="modal">OK</button>
        </div>
      </div>
    </div>
  </div>
  </body>
</html>
<script>
  // Run JavaScript only after the HTML page is fully loaded
  $(document).ready(function () {

    // Create Bootstrap modal object for controlling popup form
    var modal = new bootstrap.Modal(
        document.getElementById("studentModal")
    );

    var selectedRow = null;
    var nextId = 2;

    var emailPattern = /^[^\s@]+@[^\s@]+\.com$/i;
    var namePattern = /^[a-zA-Z]+(?: [a-zA-Z]+)*$/;
    var phonePattern = /^0[0-9]{2}\s?[0-9]{3}\s?[0-9]{3,4}$/;

    // Convert date to YYYY-MM-DD for date input
    function dateToInput(date) {
        if (!date) return "";

        if (/^\d{4}-\d{2}-\d{2}$/.test(date)) {
            return date;
        }

        var d = new Date(date);

        if (isNaN(d.getTime())) return "";

        var year = d.getFullYear();
        var month = String(d.getMonth() + 1).padStart(2, "0");
        var day = String(d.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }

    // Convert YYYY-MM-DD to DD-MMM-YYYY
    function formatDate(date) {
        if (!date) return "";

        var d = new Date(date + "T00:00:00");

        var months = [
            "Jan", "Feb", "Mar", "Apr",
            "May", "Jun", "Jul", "Aug",
            "Sep", "Oct", "Nov", "Dec"
        ];

        var day = String(d.getDate()).padStart(2, "0");

        return `${day}-${months[d.getMonth()]}-${d.getFullYear()}`;
    }

    // Select All
    $("#checkAll").click(function () {
        $(".row-check").prop("checked", this.checked);
    });

    // Add New
    $("#btnAdd").click(function () {

        selectedRow = null;

        $("#studentForm")[0].reset();

        $(".text-danger").text("");

        $("#modalTitle").text("Add New");

        $("#saveBtn").html(
            '<i class="bi bi-check-lg"></i> Create'
        );

        $("#id").val(nextId);

        modal.show();
    });

    // Edit
    $("#btnEdit").click(function () {

        var row = $(".row-check:checked").closest("tr");

        if (row.length != 1) {
            alert("Please select one student");
            return;
        }

        selectedRow = row;

        $("#modalTitle").text("Edit Student");

        $("#saveBtn").html(
            '<i class="bi bi-check-lg"></i> Save'
        );
        // Load student data into form fields
        $("#id").val(row.find("td:eq(1)").text());
        $("#name").val(row.find("td:eq(2)").text());
        $("#sex").val(row.find("td:eq(3)").text());
        $("#phone").val(row.find("td:eq(4)").text());

        // Convert displayed date to date input format
        $("#dob").val(
            dateToInput(row.find("td:eq(5)").text())
        );

        $("#email").val(row.find("td:eq(6)").text());

        $(".text-danger").text("");

        modal.show();
    });

    // Remove
    $("#btnRemove").click(function () {

        if ($(".row-check:checked").length == 0) {
            alert("Please select a student to remove.");
            return;
        }

        $(".row-check:checked").closest("tr").remove();

        $("#checkAll").prop("checked", false);
    });

    // Save
    $("#studentForm").submit(function (e) {

        e.preventDefault();

        
        var id = $("#id").val();
        var name = $("#name").val().trim();
        var sex = $("#sex").val();
        var phone = $("#phone").val().trim();
        var dob = $("#dob").val();
        var email = $("#email").val().trim();

        // Clear errors
        $("#nameError").text("");
        $("#phoneError").text("");
        $("#emailError").text("");
        $("#dobError").text("");

        // Check unchanged data
        if (selectedRow != null) {

            var oldName = selectedRow.find("td:eq(2)").text();
            var oldSex = selectedRow.find("td:eq(3)").text();
            var oldPhone = selectedRow.find("td:eq(4)").text();
            var oldDob = dateToInput(selectedRow.find("td:eq(5)").text());
            var oldEmail = selectedRow.find("td:eq(6)").text();

            if (
                oldName == name &&
                oldSex == sex &&
                oldPhone == phone &&
                oldDob == dob &&
                oldEmail == email
            ) {
                alert("No changes were made.");
                return;
            }
        }

        // Name validation
        if (name == "") {
            $("#nameError").text("Full Name is required.");
            return;
        }
         if (dob == "") {
            $("#dobError").text("Full DOB is required.");
            return;
        }
         if (email == "") {
            $("#emailError").text("Full Email is required.");
            return;
        }
         if (phone == "") {
            $("#phoneError").text("Full Phone is required.");
            return;
        }

        if (!namePattern.test(name)) {
            $("#nameError").text("Allow English name only.");
            return;
        }

        // Email validation
        if (!emailPattern.test(email)) {
            $("#emailError").text("Email must be like example@gmail.com.");
            return;
        }
        // Phone validation
        if (!phonePattern.test(phone)) {
            $("#phoneError").text(
                "Phone must start with 0 and contain 9-10 digits."
            );
            return;
        }

        // DOB validation
        if (dob == "") {
            $("#dobError").text("Date of birth is required.");
            return;
        }

        var today = new Date();
        var todayString = [
            today.getFullYear(),
            String(today.getMonth() + 1).padStart(2, "0"),
            String(today.getDate()).padStart(2, "0")
        ].join("-");

        if (dob > todayString) {
            $("#dobError").text("Date of birth cannot be a future date.");
            return;
        }

        // Duplicate Email validation
        var duplicateEmail = false;

        $("#studentTable tr").each(function () {

            var currentEmail = $(this).find("td:eq(6)").text();

            if (
                currentEmail.toLowerCase() == email.toLowerCase() &&
                (selectedRow == null || this !== selectedRow[0])
            ) {
                duplicateEmail = true;
            }
        });

        if (duplicateEmail) {
            $("#emailError").text("Email already exists.");
            return;
        }

        // Duplicate Phone validation
        var duplicatePhone = false;

        $("#studentTable tr").each(function () {

            var currentPhone = $(this).find("td:eq(4)").text();

            if (
                currentPhone == phone &&
                (selectedRow == null || this !== selectedRow[0])
            ) {
                duplicatePhone = true;
            }
        });

        if (duplicatePhone) {
            $("#phoneError").text("Phone number already exists.");
            return;
        }

        // Edit Student
        if (selectedRow != null) {

            selectedRow.find("td:eq(1)").text(id);
            selectedRow.find("td:eq(2)").text(name);
            selectedRow.find("td:eq(3)").text(sex);
            selectedRow.find("td:eq(4)").text(phone);
            selectedRow.find("td:eq(5)").text(formatDate(dob));
            selectedRow.find("td:eq(6)").text(email);

        }

        // Add Student
        else {

            var row = `
                <tr>
                    <td>
                        <input type="checkbox" class="form-check-input row-check">
                    </td>
                    <td>${id}</td>
                    <td>${$("<div>").text(name).html()}</td>
                    <td>${sex}</td>
                    <td>${$("<div>").text(phone).html()}</td>
                    <td>${formatDate(dob)}</td>
                    <td>${$("<div>").text(email).html()}</td>
                </tr>
            `;

            $("#studentTable").append(row);

            nextId++;
        }

        // Close modal and reset form
        modal.hide();

        $("#studentForm")[0].reset();

        selectedRow = null;

        $("#checkAll").prop("checked", false);

    });

});
</script>
