<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students Information</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="jquery-4.0.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-body-tertiary">

<main class="container py-5">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4 p-md-5">

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <h1 class="h3 fw-bold mb-0">Students Information</h1>
        <div>
          <button id="btnAdd" class="btn btn-dark"><i class="bi bi-plus-lg me-1"></i>Add New</button>
          <button id="btnEdit" class="btn btn-success"><i class="bi bi-pencil me-1"></i>Edit</button>
          <button id="btnRemove" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Remove</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="table table-hover align-middle text-center mb-0">
          <thead class="table-dark">
            <tr>
              <th style="width:50px"><input type="checkbox" id="checkAll" class="form-check-input"></th>
              <th>ID</th>
              <th>Full Name</th>
              <th>Sex</th>
              <th>Phone Number</th>
              <th>DOB</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody id="studentTable">
            <tr>
              <td><input type="checkbox" class="form-check-input row-check"></td>
              <td>1</td><td>Noy Bunthoeun</td><td>F</td><td>090 541 548</td><td>01-Jan-2000</td><td>test@gmail.com</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</main>

<!-- Student modal (used for add and edit) -->
<div class="modal fade" id="studentModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title" id="modalTitle">Add New</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <form id="studentForm" class="needs-validation" novalidate>
        <div class="modal-body">
          <div id="formError" class="alert alert-danger d-none" role="alert"></div>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="id" class="form-label fw-semibold">ID</label>
              <input type="text" class="form-control bg-body-secondary" id="id" readonly tabindex="-1">
              <div class="form-text">Generated automatically.</div>
            </div>
            <div class="col-md-6">
              <label for="name" class="form-label fw-semibold">Full Name <span style=color:red>*</span></label>
              <input type="text" class="form-control" id="name" required placeholder="N/A">
              <small id="nameError" class="text-danger"></small>
              <div class="invalid-feedback">Enter the full name.</div>
            </div>
            <div class="col-md-6">
              <label for="sex" class="form-label fw-semibold">Sex <span style=color:red>*</span></label>
              <select class="form-select" id="sex" >
               
                <option value="M">Male</option>
                <option value="F">Female</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="dob" class="form-label fw-semibold" >Date of Birth <span style=color:red>*</span></label>
              <input type="date" class="form-control" id="dob" id="dob" required placeholder="N/A">
              <small id="dobError" class="text-danger"></small>
              <div class="invalid-feedback">Choose a date of birth.</div>
            </div>
            <div class="col-md-6">
              <label for="phone" class="form-label fw-semibold">Phone Number <span style=color:red>*</span></label>
              <input type="text" class="form-control" id="phone" required placeholder="N/A">
              <div class="invalid-feedback">Enter a phone number.</div>
              <small id="phoneError" class="text-danger"></small>
            </div>
            <div class="col-md-6">
              <label for="email" class="form-label fw-semibold">Email <span style=color:red>*</span></label>
              <input type="email" class="form-control" id="email" required placeholder="N/A">
              <small id="emailError" class="text-danger"></small>
              <div class="invalid-feedback">Enter a valid email address.</div>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="submit" class="btn btn-success" id="saveBtn"><i class="bi bi-check-lg me-1"></i>Create</button>
          <button type="button" class="btn btn-danger" data-bs-dismiss="modal"><i class="bi bi-x-lg me-1"></i>Close</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Alert modal -->
<div class="modal fade" id="alertModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-body text-center p-4">
        <p class="mb-3" id="alertText"></p>
        <button type="button" class="btn btn-dark btn-sm" data-bs-dismiss="modal">OK</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>

<script>
    $(document).ready(function () {
    //new form
    var modal = new bootstrap.Modal(
        document.getElementById("studentModal")
    );
    //edit row
    var selectedRow = null;
    var nextId = 2;
    var oldName = "";
    var oldSex = "";
    var oldPhone = "";
    var oldDob = "";
    var oldEmail = "";
    // Select All
    $("#checkAll").click(function () {

        $(".row-check").prop(
            "checked",
            this.checked
        );

    });

    // Add New
    $("#btnAdd").click(function () {

        selectedRow = null;
        

        $("#studentForm")[0].reset();

        $("#modalTitle").text("Add New");

        $("#saveBtn").html(
            '<i class="bi bi-check-lg"></i> Create'
        );

        $("#id").val(nextId);

        modal.show();

    });

    // Edit
    $("#btnEdit").click(function () {

        var row =
            $(".row-check:checked")
            .closest("tr");

        if (row.length != 1) {

            alert("Please select one student");

            return;
        }

        selectedRow = row;
        oldName = row.find("td:eq(2)").text();
        oldSex = row.find("td:eq(3)").text();
        oldPhone = row.find("td:eq(4)").text();
        oldDob = row.find("td:eq(5)").text();
        oldEmail = row.find("td:eq(6)").text();

        $("#modalTitle").text("Edit Student");

        $("#saveBtn").html(
            '<i class="bi bi-check-lg"></i> Save'
        );

        $("#id").val(
            row.find("td:eq(1)").text()
        );

        $("#name").val(
            row.find("td:eq(2)").text()
        );

        $("#sex").val(
            row.find("td:eq(3)").text()
        );

        $("#phone").val(
            row.find("td:eq(4)").text()
        );
        $("#dob").val(
            row.find("td:eq(5)").text()
        );

        $("#email").val(
            row.find("td:eq(6)").text()
        );

        modal.show();

    });

    // Remove
    $("#btnRemove").click(function () {

        $(".row-check:checked")
            .closest("tr")
            .remove();

        $("#checkAll").prop("checked", false);

    });

    // Save
$("#studentForm").submit(function (e) {

    e.preventDefault();

    var id = $("#id").val();
    var name = $("#name").val();
    var sex = $("#sex").val();
    var phone = $("#phone").val();
    var dob = $("#dob").val();
    var email = $("#email").val();
    $("#nameError").text("");
    $("#phoneError").text("");
    $("#emailError").text("");
    $("#dobError").text("");

    if (selectedRow != null) {

    if (
        oldName == name &&
        oldSex == sex &&
        oldPhone == phone &&
        oldDob == dob &&
        oldEmail == email
    ) {
        alert("No changes were made.");
        return;
    }

}

        if(name.trim() == ""){
        $("#nameError").text("Full Name is required.");
        return;
    }
    if (!emailPattern.test(email)) {

        $("#emailError").text(
            "Email must be like example@gmail.com"
        );

        return;
    }
    if (!phonePattern.test(phone)) {

        $("#phoneError").text(
            "Phone must start with 0 and contain 9-10 digits."
        );

        return;
    }
    if (selectedDob > today) {

        $("#dobError").text(
            "Date of birth cannot be a future date."
        );

        return;
    }

    // Email Validation

    var emailPattern = /^[^\s@]+@[^\s@]+\.com$/i;

    if (!emailPattern.test(email)) {
        alert("Email must be like example@gmail.com");
        return;
    }
    var checkname = /^[a-zA-Z]+(?: [a-zA-Z]+)*$/;
    if(!checkname.test(name)){
        alert("Allow English name only");
        return;
    }

    // Phone Validation

    var phonePattern = /^0[0-9]{8,9}$/;

    if (!phonePattern.test(phone)) {
        alert("Phone number must start with 0 and contain 9 or 10 digits.");
        return;
    }

    // Date of Birth Validation

    var today = new Date();
    var selectedDob = new Date(dob);

    if (selectedDob > today) {
        alert("Date of Birth cannot be a future date.");
        return;
    }

    // Duplicate Email Validation

    var duplicateEmail = false;

    $("#studentTable tr").each(function () {

        var currentEmail = $(this)
            .find("td:eq(6)")
            .text();

        if (
            currentEmail == email &&
            this != selectedRow?.[0]
        ) {
            duplicateEmail = true;
        }

    });

    if (duplicateEmail) {
        alert("Email already exists.");
        return;
    }

    // Duplicate Phone Validation

    var duplicatePhone = false;

    $("#studentTable tr").each(function () {

        var currentPhone = $(this)
            .find("td:eq(4)")
            .text();

        if (
            currentPhone == phone &&
            this != selectedRow?.[0]
        ) {
            duplicatePhone = true;
        }

    });

    if (duplicatePhone) {
        alert("Phone number already exists.");
        return;
    }

    // Edit Student

    if (selectedRow != null) {

        selectedRow.find("td:eq(1)").text(id);
        selectedRow.find("td:eq(2)").text(name);
        selectedRow.find("td:eq(3)").text(sex);
        selectedRow.find("td:eq(4)").text(phone);
        selectedRow.find("td:eq(5)").text(dob);
        selectedRow.find("td:eq(6)").text(email);

    }

    // Add Student

    else {

        var row = `
        <tr>
            <td>
                <input type="checkbox"
                       class="form-check-input row-check">
            </td>
            <td>${id}</td>
            <td>${name}</td>
            <td>${sex}</td>
            <td>${phone}</td>
            <td>${dob}</td>
            <td>${email}</td>
        </tr>
        `;

        $("#studentTable").append(row);

        nextId++;
    }

    modal.hide();
    $("#studentForm")[0].reset();

});

});
</script>
